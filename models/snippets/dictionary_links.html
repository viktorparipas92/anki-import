<div class="wr">
  <a id="wr-link" target="_blank" aria-label="WordReference"
     data-url="https://www.wordreference.com/{lang}/{word}">
		Link to WR
	</a>
</div>

<div class="wikt">
  <button type="button" id="wikt-btn" aria-label="Wiktionary"
          data-frame="wikt-frame"
          data-url="https://en.wiktionary.org/wiki/{word}#{lang}">
		Wiktionary &#9662;
	</button>
	<br>
  <iframe id="wikt-frame" hidden></iframe>
</div>

<script src="_dictionary_links.js"></script>
