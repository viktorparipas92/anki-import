name: Deploy to Synology NAS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-synology

env:
  NAS_PATH: /volume1/docker/anki-import

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner is on the NAS, so this is a local copy out of its workspace
      # into the directory Task Scheduler and Compose use. secrets/ and .env stay
      # untouched, as they are not in the repository.
      - name: Copy the checkout to the deploy directory
        run: |
          mkdir -p "$NAS_PATH"
          tar -cf - --exclude=./.git --exclude=./.github . | tar -xf - -C "$NAS_PATH"

      - name: Write the service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo 'GOOGLE_SERVICE_ACCOUNT_JSON is not set, keeping the key already on the NAS.'
            exit 0
          fi
          mkdir -p "$NAS_PATH/secrets"
          install -m 600 /dev/null "$NAS_PATH/secrets/service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$NAS_PATH/secrets/service-account.json"

      - name: Write .env
        env:
          LATEST_FRENCH_DECK: ${{ vars.LATEST_FRENCH_DECK }}
          NAS_TZ: ${{ vars.TZ }}
        run: |
          if [ -z "$LATEST_FRENCH_DECK" ]; then
            echo 'LATEST_FRENCH_DECK is not set, keeping the .env already on the NAS.'
            exit 0
          fi
          {
            echo "SERVICE_ACCOUNT_FILE=secrets/service-account.json"
            echo "LATEST_FRENCH_DECK=$LATEST_FRENCH_DECK"
            echo "TZ=${NAS_TZ:-UTC}"
          } > "$NAS_PATH/.env"

      # sudo -n fails fast instead of hanging on a password prompt, so the NAS user
      # needs NOPASSWD for docker in /etc/sudoers.
      - name: Start Anki and rebuild the importer
        run: |
          cd "$NAS_PATH"
          sudo -n docker compose up -d --build anki-desktop
          sudo -n docker compose --profile on-demand build anki-importer
